name: 2.1 TC_N_25_CS GetLog uploads the security log, and TriggerMessage reports Idle after it
station: { id: REG21S-LOG, persona: regression-2.1 }
steps:
  - csmsCall:
      action: GetLog
      payload:
        { logType: SecurityLog, requestId: 4, log: { remoteLocation: 'ftp://logs.example.com/' } }
      answer: { status: Accepted, filename: { $regex: '^security-.*\.log$' } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploading, requestId: 4 } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploaded, requestId: 4 } }
  - csmsCall:
      action: TriggerMessage
      payload: { requestedMessage: LogStatusNotification }
      answer: { status: Accepted }
  - expect:
      { sent: LogStatusNotification, payload: { status: Idle, requestId: { $exists: false } } }
---
name: 2.1 A04 Security events at startup and after a reset reach the CSMS
station: { id: REG21S-EVENTS, persona: regression-2.1 }
steps:
  - expect: { sent: SecurityEventNotification, payload: { type: StartupOfTheDevice } }
  - csmsCall: { action: Reset, payload: { type: Immediate }, answer: { status: Accepted } }
  # Queued messages go out before the reboot.
  - expect: { sent: SecurityEventNotification, payload: { type: ResetOrReboot } }
  - expect: { sent: BootNotification, payload: { reason: RemoteReset }, within: 15s }
---
name: 2.1 N01 GetLog uploads a DataCollectorLog, the log type 2.1 adds
station: { id: REG21S-COLLECTOR, persona: regression-2.1 }
steps:
  - csmsCall:
      action: GetLog
      payload:
        {
          logType: DataCollectorLog,
          requestId: 9,
          log: { remoteLocation: 'ftp://logs.example.com/' },
        }
      answer: { status: Accepted }
  - expect: { sent: LogStatusNotification, payload: { status: Uploading, requestId: 9 } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploaded, requestId: 9 } }
