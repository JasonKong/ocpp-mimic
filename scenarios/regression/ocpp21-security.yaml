# The OCPP 2.0.1 security scenarios (ocpp201-security.yaml) on a 2.1 station
# (T100): 2.1 keeps 2.0.1's security behaviour, adds a requestId to SignCertificate
# that the built-in CSMS echoes (A02.FR.24, .25), and checks every frame against
# OCA's 2.1 schemas.
name: 2.1 TC_A_01_CS Basic Auth with Security Profile 1, and a new BasicAuthPassword
csmsOptions: { passwords: { REG21S-SEC-1: station-key-0001 } }
station:
  id: REG21S-SEC-1
  persona: regression-2.1
  password: station-key-0001
  security: { profile: 1 }
steps:
  - expectStation: { registration: Accepted, config: { SecurityCtrlr/SecurityProfile: '1' } }
  - expect: { sent: SecurityEventNotification, payload: { type: StartupOfTheDevice } }
  # Write-only: it can be set, never read (A01).
  - csmsCall:
      action: SetVariables
      payload:
        setVariableData:
          - component: { name: SecurityCtrlr }
            variable: { name: BasicAuthPassword }
            attributeValue: a-new-station-key-0002
      answer: { setVariableResult: [{ attributeStatus: Accepted }] }
  - csmsCall:
      action: GetVariables
      payload:
        getVariableData:
          [{ component: { name: SecurityCtrlr }, variable: { name: BasicAuthPassword } }]
      answer: { getVariableResult: [{ attributeStatus: Rejected }] }
  - expectStation:
      securityEvents: { $contains: { type: ReconfigurationOfSecurityParameters } }
---
name: 2.1 TC_A_03_CS A wrong password is refused
csmsOptions: { passwords: { REG21S-SEC-1-BAD: station-key-0001 } }
station:
  id: REG21S-SEC-1-BAD
  persona: regression-2.1
  password: not-the-right-key
  security: { profile: 1 }
  waitForBoot: false
steps:
  - expectStation: { connectionError: { $regex: '401' }, registration: Offline }
---
name: 2.1 TC_A_04_CS and TC_A_05_CS TLS checked against the CSMS root certificate
csmsOptions: { tls: true, passwords: { REG21S-SEC-2: station-key-0002 } }
stations:
  - id: REG21S-SEC-2
    persona: regression-2.1
    password: station-key-0002
    security: { profile: 2, ca: 'test-pki:ca.crt' }
  - id: REG21S-SEC-2-BAD
    persona: regression-2.1
    password: station-key-0002
    security: { profile: 2, ca: 'test-pki:other-ca.crt' }
    waitForBoot: false
steps:
  - expectStation: { station: REG21S-SEC-2, registration: Accepted, transport: open }
  - expectStation:
      {
        station: REG21S-SEC-2-BAD,
        connectionError: { $regex: 'certificate' },
        registration: Offline,
      }
---
name: 2.1 TC_A_07_CS and TC_A_11_CS Client certificate, renewed by the CSMS
csmsOptions: { tls: { clientCertificates: required } }
station:
  id: REG21S-SEC-3
  persona: regression-2.1
  security:
    profile: 3
    ca: 'test-pki:ca.crt'
    cert: 'test-pki:client.crt'
    key: 'test-pki:client.key'
steps:
  - expect: { sent: BootNotification } # the first boot; later expects find the next one
  - csmsCall:
      action: TriggerMessage
      payload: { requestedMessage: SignChargingStationCertificate }
      answer: { status: Accepted }
  - expect:
      sent: SignCertificate
      payload:
        csr: { $regex: '^-----BEGIN CERTIFICATE REQUEST-----' }
        certificateType: ChargingStationCertificate
        requestId: { $exists: true }
      answer: { status: Accepted }
      save: { request: '$.payload.requestId' }
  # 2.1: the CSMS echoes the requestId, and the station checks it (A02.FR.25, .26).
  - expect:
      received: CertificateSigned
      payload: { requestId: '{{request}}' }
      answer: { status: Accepted }
  # The station switches to the new certificate by reconnecting (A02.FR.08).
  - expect: { sent: BootNotification }
  - expectStation: { registration: Accepted, certificates: { chargePoint: true } }
---
name: 2.1 TC_A_19_CS and TC_A_22_CS Upgrade to Security Profile 2 with a network profile, never back
csmsOptions: { tls: true, passwords: { REG21S-SEC-UP: station-key-0003 } }
station:
  id: REG21S-SEC-UP
  persona: regression-2.1
  password: station-key-0003
  security: { profile: 1, ca: 'test-pki:ca.crt' }
steps:
  - expect: { sent: BootNotification } # the first boot; later expects find the next one
  - csmsCall:
      action: SetNetworkProfile
      payload:
        configurationSlot: 1
        connectionData:
          {
            ocppVersion: OCPP20,
            ocppTransport: JSON,
            ocppCsmsUrl: '{{csmsUrl}}',
            messageTimeout: 30,
            securityProfile: 2,
            ocppInterface: Wired0,
          }
      answer: { status: Accepted }
  - csmsCall:
      action: SetVariables
      payload:
        setVariableData:
          - component: { name: OCPPCommCtrlr }
            variable: { name: NetworkConfigurationPriority }
            attributeValue: '1,0'
      answer: { setVariableResult: [{ attributeStatus: RebootRequired }] }
  - csmsCall: { action: Reset, payload: { type: OnIdle }, answer: { status: Accepted } }
  - expect: { sent: BootNotification, payload: { reason: RemoteReset }, within: 15s }
  - expectStation:
      registration: Accepted
      config:
        SecurityCtrlr/SecurityProfile: '2'
        OCPPCommCtrlr/NetworkConfigurationPriority: '1'
        OCPPCommCtrlr/ActiveNetworkProfile: '1'
  # No way back to a lower profile (B09.FR.04).
  - csmsCall:
      action: SetNetworkProfile
      payload:
        configurationSlot: 2
        connectionData:
          {
            ocppVersion: OCPP20,
            ocppTransport: JSON,
            ocppCsmsUrl: '{{csmsUrl}}',
            messageTimeout: 30,
            securityProfile: 1,
            ocppInterface: Wired0,
          }
      answer: { status: Rejected }
---
name: 2.1 TC_B_46_CS A network profile that does not connect falls back to the previous one
csmsOptions: { passwords: { REG21S-SEC-BACK: station-key-0004 } }
station:
  id: REG21S-SEC-BACK
  persona: regression-2.1
  password: station-key-0004
  security: { profile: 1 }
  deviceModel: { OCPPCommCtrlr: { NetworkProfileConnectionAttempts: 1 } }
steps:
  - expect: { sent: BootNotification } # the first boot; later expects find the next one
  # Nothing listens on port 1: the station comes back on slot 0.
  - csmsCall:
      action: SetNetworkProfile
      payload:
        configurationSlot: 1
        connectionData:
          {
            ocppVersion: OCPP20,
            ocppTransport: JSON,
            ocppCsmsUrl: 'ws://127.0.0.1:1/ocpp',
            messageTimeout: 30,
            securityProfile: 1,
            ocppInterface: Wired0,
          }
      answer: { status: Accepted }
  - csmsCall:
      action: SetVariables
      payload:
        setVariableData:
          - component: { name: OCPPCommCtrlr }
            variable: { name: NetworkConfigurationPriority }
            attributeValue: '1,0'
      answer: { setVariableResult: [{ attributeStatus: RebootRequired }] }
  - csmsCall: { action: Reset, payload: { type: Immediate }, answer: { status: Accepted } }
  - expect: { sent: BootNotification, payload: { reason: RemoteReset }, within: 15s }
  - expectStation:
      registration: Accepted
      config: { SecurityCtrlr/SecurityProfile: '1', OCPPCommCtrlr/ActiveNetworkProfile: '0' }
