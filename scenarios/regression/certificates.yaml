steps:
  - csmsCall:
      action: GetInstalledCertificateIds
      payload: { certificateType: ManufacturerRootCertificate }
      answer: { status: NotFound }
  - csmsCall:
      action: InstallCertificate
      payload: { certificateType: ManufacturerRootCertificate, certificate: '{{root}}' }
      answer: { status: Accepted }
  - csmsCall:
      action: InstallCertificate
      payload: { certificateType: CentralSystemRootCertificate, certificate: not a certificate }
      answer: { status: Rejected }
  - csmsCall:
      action: GetInstalledCertificateIds
      payload: { certificateType: ManufacturerRootCertificate }
      answer:
        status: Accepted
        certificateHashData: { $size: 1 }
      save: { hash: '$.answer.certificateHashData[0]' }
  - csmsCall:
      action: DeleteCertificate
      payload: { certificateHashData: '{{hash}}' }
      answer: { status: Accepted }
  - csmsCall:
      action: DeleteCertificate
      payload: { certificateHashData: '{{hash}}' }
      answer: { status: NotFound }
---
name: 'Profile 3: the CSMS renews the station certificate, and the station reconnects with it'
csmsOptions: { tls: { clientCertificates: required } }
station:
  id: REG-CERT-RENEW
  persona: regression-1.6
  config: { CpoName: ocpp-mimic }
  security:
    profile: 3
    ca: 'test-pki:ca.crt'
    cert: 'test-pki:client.crt'
    key: 'test-pki:client.key'
steps:
  - expect: { sent: BootNotification } # the first boot; later expects find the next one
  - csmsCall:
      action: ExtendedTriggerMessage
      payload: { requestedMessage: SignChargePointCertificate }
      answer: { status: Accepted }
  - expect:
      sent: SignCertificate
      payload: { csr: { $regex: '^-----BEGIN CERTIFICATE REQUEST-----' } }
      answer: { status: Accepted }
  - expect: { received: CertificateSigned, answer: { status: Accepted } }
  - expect: { sent: BootNotification }
  - expectStation: { registration: Accepted, certificates: { chargePoint: true } }
