# Station failures a CSMS test may need: behaviour switches (T141) and a firmware
# whose installation fails its verification.
name: Behaviour switches make 2.0.1 commands fail on purpose
station: { id: REG201-FAIL, persona: regression-2.0.1 }
steps:
  - setBehaviour:
      { failUnlock: true, failNetworkProfile: true, refuseLogs: true, failCertificates: true }
  - csmsCall:
      action: UnlockConnector
      payload: { evseId: 1, connectorId: 1 }
      answer: { status: UnlockFailed }
  - csmsCall:
      action: SetNetworkProfile
      payload:
        configurationSlot: 1
        connectionData:
          ocppVersion: OCPP20
          ocppTransport: JSON
          ocppCsmsUrl: 'ws://localhost:9100/ocpp'
          messageTimeout: 30
          securityProfile: 0
          ocppInterface: Wired0
      answer: { status: Failed }
  - csmsCall:
      action: GetLog
      payload:
        {
          logType: DiagnosticsLog,
          requestId: 7,
          log: { remoteLocation: 'ftp://logs.example.com/' },
        }
      answer: { status: Rejected }
  - csmsCall:
      action: DeleteCertificate
      payload:
        certificateHashData:
          { hashAlgorithm: SHA256, issuerNameHash: aa, issuerKeyHash: bb, serialNumber: '01' }
      answer: { status: Failed }
  # Switched off, the same commands work again.
  - setBehaviour: { failUnlock: false, refuseLogs: false }
  - csmsCall:
      action: UnlockConnector
      payload: { evseId: 1, connectorId: 1 }
      answer: { status: Unlocked }
  - csmsCall:
      action: GetLog
      payload:
        {
          logType: DiagnosticsLog,
          requestId: 8,
          log: { remoteLocation: 'ftp://logs.example.com/' },
        }
      answer: { status: Accepted }
---
name: TC_G_20_CS A cable that cannot be locked is reported and does not charge (G05)
station: { id: REG201-LOCK, persona: regression-2.0.1, behaviour: { failLock: true } }
steps:
  - presentCard: { idToken: TAG-LOCK, type: ISO14443, result: authorized }
  - plugIn: { ev: compact-40kwh }
  - expect:
      sent: NotifyEvent
      payload:
        eventData:
          - trigger: Delta
            actualValue: 'true'
            component: { name: ConnectorPlugRetentionLock, evse: { id: 1, connectorId: 1 } }
            variable: { name: Problem }
  # No charging (G05.FR.01): the connector draws nothing.
  - wait: 2s
  - expectConnector: { powerW: 0 }
  - unplug: {}
  - expect:
      sent: NotifyEvent
      payload:
        eventData:
          - { actualValue: 'false', component: { name: ConnectorPlugRetentionLock } }
