# A short load plan CI runs on every change (docs/design.md, "M4 scale"):
# 100 stations of OCPP 1.6, 2.0.1 and 2.1 (M7), with quick sessions and a
# reconnect storm, against `ocpp-mimic csms`. With `--tariff
# scenarios/load/tariff.json --install-tariff` the 2.1 stations price their
# sessions themselves.
name: Smoke - 100 stations for two minutes
csms: ws://127.0.0.1:9102/ocpp
seed: 1
duration: 2m
rampUp: { rate: 20, jitter: 0.5 }
groups:
  - name: ac
    count: 34
    id: SMOKE-{001}
    persona: load-ac-1.6
    usage:
      sessionsPerHour: 120
      stay: { min: 15s, max: 40s }
      steps: { min: 1s, max: 3s }
  - name: ac201
    count: 33
    id: SMOKE201-{001}
    persona: load-ac-2.0.1
    usage:
      sessionsPerHour: 120
      stay: { min: 15s, max: 40s }
      steps: { min: 1s, max: 3s }
  - name: ac21
    count: 33
    id: SMOKE21-{001}
    persona: load-ac-2.1
    usage:
      sessionsPerHour: 120
      stay: { min: 15s, max: 40s }
      steps: { min: 1s, max: 3s }
events:
  - at: 60s
    reconnectStorm: {}
thresholds:
  bootAcceptedWithin: 30s
  recoverWithin: 60s
  unexpectedDisconnects: 0
  lateWork: { p99: 1s }
  timeouts: 0
  callErrors: 0
  schemaViolations: 0
  eventLoopDelay: { p99: 100ms }
  memory: { rss: 1GB }
  sessions: { min: 0.5 }
