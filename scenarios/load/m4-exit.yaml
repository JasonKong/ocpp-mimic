# The M4 exit criterion (docs/design.md, "M4 scale"): 1,000 stations for an
# hour on a 2-vCPU GitHub-hosted runner, against `ocpp-mimic csms` running as
# a second process that answers after a random 20 to 100 ms.
name: M4 exit - 1,000 stations for an hour
csms: ws://127.0.0.1:9100/ocpp
seed: 1
duration: 60m
rampUp: { rate: 10, jitter: 0.5 }
groups:
  - name: ac
    count: 1000
    id: LOAD-{0001}
    persona: load-ac-1.6
    usage:
      sessionsPerHour: 1
      stay: { min: 10m, max: 40m }
      idTags: { prefix: LOAD-, count: 500, unknownShare: 0.05, unknownPrefix: UNKNOWN- }
events:
  - at: 30m
    reconnectStorm: {}
  - at: 45m
    inject: { type: powerLoss, off: 30s }
    stations: { share: 0.05 }
thresholds:
  bootAcceptedWithin: 60s
  recoverWithin: 120s
  unexpectedDisconnects: 0
  lateWork: { p99: 1s, max: 5s }
  eventLoopDelay: { p99: 100ms }
  memory: { rss: 2GB, heapGrowth: 10% }
  timeouts: 0
  callErrors: 0
  schemaViolations: 0
  sessions: { min: 0.8 }
