name: TC_M_21_CSMS Delete a certificate from a charging station - Failed
csms: ws://localhost:8081
station: { id: MIMIC-M21, persona: regression-2.0.1, behaviour: { failCertificates: true } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/certificates/deleteCertificate?identifier=MIMIC-M21&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          certificateHashData:
            { hashAlgorithm: SHA256, issuerNameHash: aa, issuerKeyHash: bb, serialNumber: '01' },
        }
  - expect: { received: DeleteCertificate, answer: { status: Failed } }
