# Station failures a CSMS test needs (T141): ocpp-mimic fails on purpose, with a
# behaviour switch or a persona, and CitrineOS takes the failure.
name: TC_B_44_CSMS Set a new network connection profile - Failed
csms: ws://localhost:8081
station: { id: MIMIC-B44, persona: regression-2.0.1, behaviour: { failNetworkProfile: true } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/setNetworkProfile?identifier=MIMIC-B44&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        configurationSlot: 1
        connectionData:
          ocppVersion: OCPP20
          ocppTransport: JSON
          ocppCsmsUrl: 'ws://localhost:8081'
          messageTimeout: 30
          securityProfile: 0
          ocppInterface: Wired0
  - expect: { received: SetNetworkProfile, answer: { status: Failed } }
---
name: TC_G_20_CSMS Connector status notification - lock failure
csms: ws://localhost:8081
station: { id: MIMIC-G20, persona: regression-2.0.1, behaviour: { failLock: true } }
steps:
  - plugIn: { ev: compact-40kwh }
  - expect:
      sent: NotifyEvent
      payload:
        eventData:
          - trigger: Delta
            actualValue: 'true'
            component: { name: ConnectorPlugRetentionLock }
            variable: { name: Problem }
      answer: {}
