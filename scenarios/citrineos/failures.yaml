name: TC_N_34_CSMS Retrieve log information - Rejected
csms: ws://localhost:8081
station: { id: MIMIC-N34, persona: regression-2.0.1, behaviour: { refuseLogs: true } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getLog?identifier=MIMIC-N34&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          logType: DiagnosticsLog,
          requestId: 34,
          log: { remoteLocation: 'ftp://logs.example.com/' },
        }
  - expect: { received: GetLog, answer: { status: Rejected } }
  - expectNo: { sent: LogStatusNotification, within: 2s }
