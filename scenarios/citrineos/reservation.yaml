      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { requestId: 2071, reportBase: FullInventory }
  - expect: { received: GetBaseReport, answer: { status: Accepted } }
  - expect:
      { sent: NotifyReport, payload: { requestId: 2071, tbc: { $exists: false } }, answer: {} }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/evdriver/reserveNow?identifier=MIMIC-H07&tenantId=1'
