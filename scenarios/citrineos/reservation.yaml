station: { id: MIMIC-H20, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getBaseReport?identifier=MIMIC-H20&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { requestId: 220, reportBase: FullInventory }
      expect: { json: [{ success: true }] }
  - expect: { received: GetBaseReport, answer: { status: Accepted } }
  - expect: { sent: NotifyReport, payload: { requestId: 220, tbc: { $exists: false } }, answer: {} }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/evdriver/reserveNow?identifier=MIMIC-H20&tenantId=1'
