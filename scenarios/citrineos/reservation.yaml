# Reservations with CitrineOS as the CSMS.
name: TC_H_01_CSMS Reserve a specific EVSE, and use the reservation
csms: ws://localhost:8081
station: { id: MIMIC-H01, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  # CitrineOS stores a reservation only for an EVSE it knows from a report.
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getBaseReport?identifier=MIMIC-H01&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { requestId: 2011, reportBase: FullInventory }
  - expect: { received: GetBaseReport, answer: { status: Accepted } }
  - expect:
      { sent: NotifyReport, payload: { requestId: 2011, tbc: { $exists: false } }, answer: {} }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/evdriver/reserveNow?identifier=MIMIC-H01&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        id: 201
        expiryDateTime: '{{now+30m}}'
        idToken: { idToken: AA000030, type: ISO14443 }
        evseId: 1
      expect: { json: [{ success: true }] }
  - expect: { received: ReserveNow, answer: { status: Accepted } }
  - expect:
      sent: StatusNotification
      payload: { evseId: 1, connectorStatus: Reserved }
      answer: {}
  - presentCard: { idToken: AA000030, result: authorized }
  - plugIn: {}
  - expect:
      sent: TransactionEvent
      payload: { eventType: Started, reservationId: 201 }
      answer: {}
