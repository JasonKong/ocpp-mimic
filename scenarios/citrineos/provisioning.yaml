---
name: TC_B_06_CSMS, TC_B_09_CSMS and TC_B_12_CSMS A single variable, and the configuration report
csms: ws://localhost:8081
station: { id: MIMIC-B06, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/monitoring/getVariables?identifier=MIMIC-B06&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          getVariableData:
            [{ component: { name: OCPPCommCtrlr }, variable: { name: OfflineThreshold } }],
        }
      expect: { json: [{ success: true }] }
  - expect:
      {
        received: GetVariables,
        answer: { getVariableResult: [{ attributeStatus: Accepted, attributeValue: '60' }] },
      }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/monitoring/setVariables?identifier=MIMIC-B06&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          setVariableData:
            [
              {
                component: { name: OCPPCommCtrlr },
                variable: { name: OfflineThreshold },
                attributeValue: '90',
              },
            ],
        }
      expect: { json: [{ success: true }] }
  - expect:
      { received: SetVariables, answer: { setVariableResult: [{ attributeStatus: Accepted }] } }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getBaseReport?identifier=MIMIC-B06&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { requestId: 12, reportBase: ConfigurationInventory }
      expect: { json: [{ success: true }] }
  - expect: { received: GetBaseReport, answer: { status: Accepted } }
  - expect: { sent: NotifyReport, payload: { requestId: 12, seqNo: 0 }, answer: {} }
