---
name: TC_G_11_CSMS, TC_G_14_CSMS and TC_G_17_CSMS Availability with a transaction
csms: ws://localhost:8081
station: { id: MIMIC-G11, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - presentCard: { idToken: AA000062, result: authorized }
  - plugIn: {}
  - expect: { sent: TransactionEvent, payload: { eventType: Started }, answer: {} }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/changeAvailability?identifier=MIMIC-G11&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { operationalStatus: Inoperative, evse: { id: 1 } }
      expect: { json: [{ success: true }] }
  - expect: { received: ChangeAvailability, answer: { status: Scheduled } }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/changeAvailability?identifier=MIMIC-G11&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { operationalStatus: Inoperative, evse: { id: 1, connectorId: 1 } }
      expect: { json: [{ success: true }] }
  - expect: { received: ChangeAvailability, answer: { status: Scheduled } }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/changeAvailability?identifier=MIMIC-G11&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { operationalStatus: Inoperative }
      expect: { json: [{ success: true }] }
  - expect: { received: ChangeAvailability, answer: { status: Scheduled } }
  - presentCard: { idToken: AA000062, result: stopping }
  - expect: { sent: TransactionEvent, payload: { eventType: Ended }, answer: {} }
  - expect:
      { sent: StatusNotification, payload: { evseId: 1, connectorStatus: Unavailable }, answer: {} }
