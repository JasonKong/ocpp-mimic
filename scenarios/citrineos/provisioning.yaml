name: TC_G_03_CSMS and TC_G_04_CSMS Change availability of an EVSE
csms: ws://localhost:8081
station: { id: MIMIC-G03, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/changeAvailability?identifier=MIMIC-G03&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { operationalStatus: Inoperative, evse: { id: 2 } }
  - expect: { received: ChangeAvailability, answer: { status: Accepted } }
  - expect:
      sent: StatusNotification
      payload: { evseId: 2, connectorStatus: Unavailable }
      answer: {}
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/changeAvailability?identifier=MIMIC-G03&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { operationalStatus: Operative, evse: { id: 2 } }
  - expect: { received: ChangeAvailability, answer: { status: Accepted } }
  - expect:
      { sent: StatusNotification, payload: { evseId: 2, connectorStatus: Available }, answer: {} }
