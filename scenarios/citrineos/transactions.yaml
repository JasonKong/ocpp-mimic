# Transactions with CitrineOS as the CSMS, without tokens (EVConnected start
# and stop points); token flows follow with authorization.
name: TC_E_09_CSMS and TC_E_14_CSMS Start at EVConnected, end on unplugging
csms: ws://localhost:8081
station:
  id: MIMIC-E09
  persona: regression-2.0.1
  deviceModel:
    TxCtrlr: { TxStartPoint: EVConnected, TxStopPoint: EVConnected }
    SampledDataCtrlr: { TxUpdatedInterval: 1 }
steps:
  - plugIn: { ev: compact-40kwh }
  - expect:
      { sent: StatusNotification, payload: { evseId: 1, connectorStatus: Occupied }, answer: {} }
  - expect:
      sent: TransactionEvent
      payload: { eventType: Started, triggerReason: CablePluggedIn, seqNo: 0 }
      answer: {}
      save: { tx: $.payload.transactionInfo.transactionId }
  - expect:
      sent: TransactionEvent
      payload:
        {
          eventType: Updated,
          triggerReason: MeterValuePeriodic,
          transactionInfo: { transactionId: '{{tx}}' },
        }
      answer: {}
      within: 5s
  - unplug: {}
  - expect:
      sent: TransactionEvent
      payload:
        eventType: Ended
        triggerReason: EVCommunicationLost
        transactionInfo: { transactionId: '{{tx}}', stoppedReason: EVDisconnected }
      answer: {}
---
name: TC_E_01_CSMS, TC_E_03_CSMS, TC_E_07_CSMS, TC_E_15_CSMS, TC_E_53_CSMS, TC_J_07_CSMS, TC_J_09_CSMS and TC_J_10_CSMS A local session with sampled meter values
csms: ws://localhost:8081
station:
  id: MIMIC-E01
  persona: regression-2.0.1
  deviceModel: { SampledDataCtrlr: { TxUpdatedInterval: 1 } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - presentCard: { idToken: AA000050, result: authorized }
  - expect: { sent: Authorize, answer: { idTokenInfo: { status: Accepted } } }
  - plugIn: {}
  - expect:
      sent: TransactionEvent
      payload:
        eventType: Started
        triggerReason: CablePluggedIn
        seqNo: 0
        meterValue: { $contains: { sampledValue: [{ context: Transaction.Begin }] } }
      answer: {}
  - expect:
      sent: TransactionEvent
      payload: { eventType: Updated, triggerReason: MeterValuePeriodic }
      answer: {}
      within: 5s
  - presentCard: { idToken: AA000050, result: stopping }
  - expect:
      sent: TransactionEvent
      payload:
        eventType: Ended
        triggerReason: StopAuthorized
        transactionInfo: { stoppedReason: Local }
        meterValue: { $contains: { sampledValue: [{ context: Transaction.End }] } }
      answer: {}
---
name: TC_E_02_CSMS, TC_E_08_CSMS and TC_E_22_CSMS Start and stop on the energy transfer
csms: ws://localhost:8081
station:
  id: MIMIC-E02
  persona: regression-2.0.1
  deviceModel: { TxCtrlr: { TxStartPoint: EnergyTransfer, TxStopPoint: EnergyTransfer } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - presentCard: { idToken: AA000051, result: authorized }
  - plugIn: {}
  - expect: { sent: TransactionEvent, payload: { eventType: Started }, answer: {} }
  - presentCard: { idToken: AA000051, result: stopping }
  - expect:
      {
        sent: TransactionEvent,
        payload: { eventType: Ended, triggerReason: StopAuthorized },
        answer: {},
      }
  - unplug: {}
  - presentCard: { idToken: AA000051, result: authorized }
  - plugIn: {}
  - expect: { sent: TransactionEvent, payload: { eventType: Started }, answer: {} }
  - evSuspend: {}
  - expect: { sent: TransactionEvent, payload: { eventType: Ended }, answer: {} }
