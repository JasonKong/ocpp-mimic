name: TC_E_10_CSMS and TC_E_39_CSMS Start when authorized, and end without a cable in time
csms: ws://localhost:8081
station:
  id: MIMIC-E10
  persona: regression-2.0.1
  deviceModel: { TxCtrlr: { TxStartPoint: Authorized, EVConnectionTimeOut: 2 } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - presentCard: { idToken: AA000052, result: authorized }
  - expect:
      {
        sent: TransactionEvent,
        payload: { eventType: Started, triggerReason: Authorized },
        answer: {},
      }
  - expect:
      sent: TransactionEvent
      payload:
        {
          eventType: Ended,
          triggerReason: EVConnectTimeout,
          transactionInfo: { stoppedReason: Timeout },
        }
      answer: {}
      within: 5s
