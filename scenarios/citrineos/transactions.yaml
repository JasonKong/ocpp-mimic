name: TC_E_30_CSMS and TC_E_34_CSMS Check the transaction status
csms: ws://localhost:8081
station: { id: MIMIC-E30, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - presentCard: { idToken: AA000054, result: authorized }
  - plugIn: {}
  - expect:
      sent: TransactionEvent
      payload: { eventType: Started }
      answer: {}
      save: { tx: $.payload.transactionInfo.transactionId }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/transactions/getTransactionStatus?identifier=MIMIC-E30&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { transactionId: '{{tx}}' }
      expect: { json: [{ success: true }] }
  - expect:
      { received: GetTransactionStatus, answer: { ongoingIndicator: true, messagesInQueue: false } }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/transactions/getTransactionStatus?identifier=MIMIC-E30&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: {}
      expect: { json: [{ success: true }] }
  - expect: { received: GetTransactionStatus, answer: { messagesInQueue: false } }
---
name: TC_J_01_CSMS, TC_J_02_CSMS and TC_J_03_CSMS Clock-aligned meter values
csms: ws://localhost:8081
station:
  id: MIMIC-J01
  persona: regression-2.0.1
  deviceModel: { AlignedDataCtrlr: { Interval: 2, SendDuringIdle: true, TxEndedInterval: 1 } }
vars: { CITRINE: http://localhost:8080 }
steps:
  - expect: { sent: MeterValues, payload: { evseId: 1 }, answer: {}, within: 5s }
  - presentCard: { idToken: AA000055, result: authorized }
  - plugIn: {}
  - expect: { sent: TransactionEvent, payload: { eventType: Started }, answer: {} }
  - expect:
      sent: TransactionEvent
      payload: { eventType: Updated, triggerReason: MeterValueClock }
      answer: {}
      within: 5s
  - presentCard: { idToken: AA000055, result: stopping }
  - expect: { sent: TransactionEvent, payload: { eventType: Ended }, answer: {} }
