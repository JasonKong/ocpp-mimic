name: TC_B_21_CSMS and TC_B_22_CSMS Reset with a transaction, OnIdle and Immediate
csms: ws://localhost:8081
station: { id: MIMIC-B21, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - presentCard: { idToken: AA000059, result: authorized }
  - plugIn: {}
  - expect: { sent: TransactionEvent, payload: { eventType: Started }, answer: {} }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/reset?identifier=MIMIC-B21&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { type: OnIdle }
      expect: { json: [{ success: true }] }
  - expect: { received: Reset, answer: { status: Scheduled } }
  - presentCard: { idToken: AA000059, result: stopping }
  - expect: { sent: TransactionEvent, payload: { eventType: Ended }, answer: {} }
  - expect: { sent: BootNotification, payload: { reason: RemoteReset }, within: 15s }
  - presentCard: { idToken: AA000059, result: authorized }
  - expect: { sent: TransactionEvent, payload: { eventType: Started }, answer: {}, within: 10s }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/reset?identifier=MIMIC-B21&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { type: Immediate }
      expect: { json: [{ success: true }] }
  - expect: { received: Reset, answer: { status: Accepted } }
  - expect:
      sent: TransactionEvent
      payload:
        {
          eventType: Ended,
          triggerReason: ResetCommand,
          transactionInfo: { stoppedReason: ImmediateReset },
        }
      answer: {}
  - expect: { sent: BootNotification, payload: { reason: RemoteReset }, within: 15s }
