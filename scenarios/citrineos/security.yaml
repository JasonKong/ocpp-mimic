name: TC_B_42_CSMS Set a new network connection profile
csms: ws://localhost:8081
station: { id: MIMIC-B43, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/setNetworkProfile?identifier=MIMIC-B43&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        configurationSlot: 1
        connectionData:
          ocppVersion: OCPP20
          ocppTransport: JSON
          ocppCsmsUrl: 'ws://localhost:8081'
          messageTimeout: 30
          securityProfile: 0
          ocppInterface: Wired0
  - expect: { received: SetNetworkProfile, answer: { status: Accepted } }
