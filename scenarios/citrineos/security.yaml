      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/certificates/installCertificate?identifier=MIMIC-M01&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { certificateType: ManufacturerRootCertificate, certificate: '{{root}}' }
  - expect: { received: InstallCertificate, answer: { status: Accepted } }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/certificates/getInstalledCertificateIds?identifier=MIMIC-M01&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { certificateType: [ManufacturerRootCertificate] }
  - expect:
      received: GetInstalledCertificateIds
      answer: { status: Accepted, certificateHashDataChain: { $size: 1 } }
      save: { hash: '$.answer.certificateHashDataChain[0].certificateHashData' }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/certificates/deleteCertificate?identifier=MIMIC-M01&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json: { certificateHashData: '{{hash}}' }
  - expect: { received: DeleteCertificate, answer: { status: Accepted } }
---
name: TC_N_25_CSMS GetLog for the security log
csms: ws://localhost:8081
station: { id: MIMIC-N25, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getLog?identifier=MIMIC-N25&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        { logType: SecurityLog, requestId: 5, log: { remoteLocation: 'ftp://logs.example.com/' } }
  - expect: { received: GetLog, answer: { status: Accepted } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploading, requestId: 5 } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploaded, requestId: 5 }, answer: {} }
---
name: TC_L_10_CSMS Firmware update, reboot and Installed
csms: ws://localhost:8081
station: { id: MIMIC-L10, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/updateFirmware?identifier=MIMIC-L10&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          requestId: 11,
          firmware:
            {
              location: 'ftp://fw.example.com/fw-5.0.0.bin',
              retrieveDateTime: '2020-01-01T00:00:00Z',
            },
        }
  - expect: { received: UpdateFirmware, answer: { status: Accepted } }
  - expect: { sent: FirmwareStatusNotification, payload: { status: Downloading, requestId: 11 } }
  - expect:
      { sent: FirmwareStatusNotification, payload: { status: InstallRebooting, requestId: 11 } }
  - expect:
      sent: BootNotification
      payload: { reason: FirmwareUpdate, chargingStation: { firmwareVersion: 5.0.0 } }
      within: 15s
  - expect:
      sent: FirmwareStatusNotification
      payload: { status: Installed, requestId: 11 }
      answer: {}
  - expect: { sent: SecurityEventNotification, payload: { type: FirmwareUpdated }, answer: {} }
---
name: TC_B_42_CSMS Set a new network connection profile
csms: ws://localhost:8081
station: { id: MIMIC-B43, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/configuration/setNetworkProfile?identifier=MIMIC-B43&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        configurationSlot: 1
        connectionData:
          ocppVersion: OCPP20
          ocppTransport: JSON
          ocppCsmsUrl: 'ws://localhost:8081'
          messageTimeout: 30
          securityProfile: 0
          ocppInterface: Wired0
  - expect: { received: SetNetworkProfile, answer: { status: Accepted } }
