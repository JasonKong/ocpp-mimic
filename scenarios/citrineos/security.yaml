name: TC_N_25_CSMS and TC_N_36_CSMS The diagnostics log, and a second request
csms: ws://localhost:8081
station: { id: MIMIC-N25, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getLog?identifier=MIMIC-N25&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          logType: DiagnosticsLog,
          requestId: 25,
          log: { remoteLocation: 'ftp://logs.example.com/' },
        }
      expect: { json: [{ success: true }] }
  - expect:
      { received: GetLog, answer: { status: Accepted, filename: { $regex: '^diagnostics-' } } }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getLog?identifier=MIMIC-N25&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        {
          logType: DiagnosticsLog,
          requestId: 36,
          log: { remoteLocation: 'ftp://logs.example.com/' },
        }
      expect: { json: [{ success: true }] }
  - expect: { received: GetLog, answer: { status: AcceptedCanceled } }
  - expect:
      {
        sent: LogStatusNotification,
        payload: { status: Uploaded, requestId: 36 },
        answer: {},
        within: 5s,
      }
