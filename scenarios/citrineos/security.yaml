name: TC_N_35_CSMS GetLog for the security log
csms: ws://localhost:8081
station: { id: MIMIC-N25, persona: regression-2.0.1 }
vars: { CITRINE: http://localhost:8080 }
steps:
  - http:
      method: POST
      url: '{{CITRINE}}/dev/token'
      json: { roles: [admin], tenantId: 1 }
      save: { TOKEN: $.json.accessToken }
  - http:
      method: POST
      url: '{{CITRINE}}/ocpp/2.0.1/reporting/getLog?identifier=MIMIC-N25&tenantId=1'
      headers: { authorization: 'Bearer {{TOKEN}}' }
      json:
        { logType: SecurityLog, requestId: 5, log: { remoteLocation: 'ftp://logs.example.com/' } }
  - expect: { received: GetLog, answer: { status: Accepted } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploading, requestId: 5 } }
  - expect: { sent: LogStatusNotification, payload: { status: Uploaded, requestId: 5 }, answer: {} }
