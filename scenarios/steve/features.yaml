      method: POST
      url: '{{STEVE_API}}/operations/GetInstalledCertificateIds'
      basicAuth: *steve
      json: { chargeBoxIdList: [REG-STEVE-SECURITY], certificateType: ManufacturerRootCertificate }
      expect: { json: { errorResponses: [], exceptions: [] } }
