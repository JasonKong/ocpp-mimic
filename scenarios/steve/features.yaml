# The M3 feature profiles and the Security Whitepaper, driven from SteVe's
# REST API (/steve/api/v1/operations): the SteVe counterparts of the
# regression scenarios for local lists, reservations, Smart Charging,
# firmware and the whitepaper messages. Needs the SteVe from tools/steve
# with STEVE_API_SECRET, the REG-STEVE-* charge points and TAG-REG registered,
# and charging profile 1001 (tools/steve/register.sh --charging-profile).
name: SteVe sends and checks the local authorization list
csms: ws://localhost:8180/steve/websocket/CentralSystemService
vars: { STEVE_API: http://localhost:8180/steve/api/v1 }
station: { id: REG-STEVE-LOCALLIST, persona: regression-1.6 }
steps:
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/SendLocalList'
      basicAuth: &steve { user: admin, password: '{{env.STEVE_API_SECRET}}' }
      json:
        chargeBoxIdList: [REG-STEVE-LOCALLIST]
        listVersion: 5
        updateType: Full
        addUpdateList: [TAG-REG]
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect:
      received: SendLocalList
      payload: { listVersion: 5, updateType: Full, localAuthorizationList: [{ idTag: TAG-REG }] }
      answer: { status: Accepted }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/GetLocalListVersion'
      basicAuth: *steve
      json: { chargeBoxIdList: [REG-STEVE-LOCALLIST] }
      expect: { json: { successResponses: [{ response: 5 }] } }
  - expect: { received: GetLocalListVersion, answer: { listVersion: 5 } }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/SendLocalList'
      basicAuth: *steve
      json:
        chargeBoxIdList: [REG-STEVE-LOCALLIST]
        listVersion: 6
        updateType: Differential
        deleteList: [TAG-REG]
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect:
      received: SendLocalList
      payload: { listVersion: 6, updateType: Differential }
      answer: { status: Accepted }
---
name: SteVe reserves a connector and cancels the reservation
csms: ws://localhost:8180/steve/websocket/CentralSystemService
vars: { STEVE_API: http://localhost:8180/steve/api/v1 }
station: { id: REG-STEVE-RESERVE, persona: regression-1.6 }
steps:
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/ReserveNow'
      basicAuth: &steve { user: admin, password: '{{env.STEVE_API_SECRET}}' }
      json:
        chargeBoxIdList: [REG-STEVE-RESERVE]
        connectorId: 1
        expiry: '{{now+30m}}'
        idTag: TAG-REG
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect:
      received: ReserveNow
      payload: { connectorId: 1, idTag: TAG-REG }
      answer: { status: Accepted }
      save: { reservation: $.payload.reservationId }
  - expect: { sent: StatusNotification, payload: { connectorId: 1, status: Reserved } }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/CancelReservation'
      basicAuth: *steve
      json: { chargeBoxIdList: [REG-STEVE-RESERVE], reservationId: '{{reservation}}' }
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect: { sent: StatusNotification, payload: { connectorId: 1, status: Available } }
---
name: SteVe sets, reads and clears a charging profile
csms: ws://localhost:8180/steve/websocket/CentralSystemService
vars: { STEVE_API: http://localhost:8180/steve/api/v1 }
station: { id: REG-STEVE-PROFILES, persona: regression-1.6 }
steps:
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/SetChargingProfile'
      basicAuth: &steve { user: admin, password: '{{env.STEVE_API_SECRET}}' }
      json: { chargeBoxIdList: [REG-STEVE-PROFILES], connectorId: 1, chargingProfilePk: 1001 }
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect:
      received: SetChargingProfile
      payload:
        connectorId: 1
        csChargingProfiles:
          { chargingProfilePurpose: TxDefaultProfile, chargingProfileKind: Relative }
      answer: { status: Accepted }
  - expectStation: { chargingProfiles: { $size: 1 } }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/GetCompositeSchedule'
      basicAuth: *steve
      json:
        {
          chargeBoxIdList: [REG-STEVE-PROFILES],
          connectorId: 1,
          durationInSeconds: 300,
          chargingRateUnit: W,
        }
      expect: { json: { errorResponses: [], exceptions: [] } }
  - expect: { received: GetCompositeSchedule, answer: { status: Accepted } }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/ClearChargingProfile'
      basicAuth: *steve
      json:
        {
          chargeBoxIdList: [REG-STEVE-PROFILES],
          filterType: ChargingProfileId,
          chargingProfilePk: 1001,
        }
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expectStation: { chargingProfiles: [] }
---
name: SteVe updates the firmware and fetches diagnostics
csms: ws://localhost:8180/steve/websocket/CentralSystemService
vars: { STEVE_API: http://localhost:8180/steve/api/v1 }
station: { id: REG-STEVE-FIRMWARE, persona: regression-1.6 }
steps:
  - expect: { sent: BootNotification } # the first boot; later expects find the next one
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/UpdateFirmware'
      basicAuth: &steve { user: admin, password: '{{env.STEVE_API_SECRET}}' }
      json:
        chargeBoxIdList: [REG-STEVE-FIRMWARE]
        location: 'ftp://fw.example.com/fw-2.6.0.bin'
        retrieveDateTime: '{{now+3s}}'
        retries: 1
        retryInterval: 1
      expect: { json: { errorResponses: [], exceptions: [] } }
  - expect: { received: UpdateFirmware, payload: { location: 'ftp://fw.example.com/fw-2.6.0.bin' } }
  - expect: { sent: FirmwareStatusNotification, payload: { status: Downloading }, within: 15s }
  - expect: { sent: FirmwareStatusNotification, payload: { status: Installing }, within: 15s }
  - expect: { sent: BootNotification, payload: { firmwareVersion: 2.6.0 }, within: 15s }
  - expect: { sent: FirmwareStatusNotification, payload: { status: Installed }, answer: {} }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/GetDiagnostics'
      basicAuth: *steve
      json: { chargeBoxIdList: [REG-STEVE-FIRMWARE], location: 'ftp://logs.example.com/' }
      expect: { json: { errorResponses: [], exceptions: [] } }
  - expect: { received: GetDiagnostics, answer: { fileName: { $regex: '^diagnostics-' } } }
  - expect: { sent: DiagnosticsStatusNotification, payload: { status: Uploaded }, answer: {} }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/TriggerMessage'
      basicAuth: *steve
      json: { chargeBoxIdList: [REG-STEVE-FIRMWARE], triggerMessage: FirmwareStatusNotification }
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect: { sent: FirmwareStatusNotification, payload: { status: Idle } }
