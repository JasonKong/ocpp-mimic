      method: POST
      url: '{{STEVE_API}}/operations/SignedUpdateFirmware'
      basicAuth: *steve
      json:
        chargeBoxIdList: [REG-STEVE-SECURITY]
        location: 'ftp://fw.example.com/fw-4.0.0.bin'
        retrieveDateTime: '{{now+3s}}'
        signature: c2lnbmF0dXJl
        signingCertificate: '{{signer}}'
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect:
      {
        sent: SignedFirmwareStatusNotification,
        payload: { status: SignatureVerified },
        within: 15s,
      }
  - expect:
      {
        sent: SignedFirmwareStatusNotification,
        payload: { status: Installed },
        within: 15s,
        answer: {},
