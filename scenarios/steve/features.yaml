      basicAuth: &steve { user: admin, password: '{{env.STEVE_API_SECRET}}' }
      json: { chargeBoxIdList: [REG-STEVE-SECURITY], triggerMessage: Heartbeat }
      expect: { json: { successResponses: [{ response: Accepted }] } }
  - expect: { sent: Heartbeat, from: step, within: 5s }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/GetLog'
      basicAuth: *steve
      json:
        {
          chargeBoxIdList: [REG-STEVE-SECURITY],
          logType: SecurityLog,
          location: 'ftp://logs.example.com/',
        }
      expect: { json: { errorResponses: [], exceptions: [] } }
