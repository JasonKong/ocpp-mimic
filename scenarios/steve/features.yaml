      {
        sent: LogStatusNotification,
        payload: { status: Uploaded, requestId: '{{request}}' },
        answer: {},
      }
  - http:
      method: POST
      url: '{{STEVE_API}}/operations/InstallCertificate'
      basicAuth: *steve
      json:
        {
          chargeBoxIdList: [REG-STEVE-SECURITY],
          certificateType: ManufacturerRootCertificate,
          certificate: '{{root}}',
