# A two-connector 22 kW AC charge point for load tests and the benchmark
# (docs/design.md, "M4 scale"). Load it with --personas scenarios/personas.
persona: load-ac-1.6
extends: generic-1.6
description: Two-connector 22 kW AC charge point for load tests
boot:
  chargePointModel: Load-AC-22
connectors: 2
power:
  offeredW: 22080
config:
  HeartbeatInterval: 60
  MeterValueSampleInterval: 60
evs:
  suv-77kwh: { capacityKWh: 77, initialSoc: 25, maxPowerW: 11000, phases: 3 }
# The usage model a station runs when it is switched on (usage: true, or
# changes to this in a station, template or load plan).
usage:
  sessionsPerHour: 1
  stay: { min: 20m, max: 2h }
  evs: { compact-40kwh: 2, sedan-75kwh: 1, suv-77kwh: 1 }
  idTags: { prefix: LOAD-, count: 500, unknownShare: 0.05, unknownPrefix: UNKNOWN- }
  cardFirst: 0.3
  stopBy: { card: 0.7, unplug: 0.3 }
