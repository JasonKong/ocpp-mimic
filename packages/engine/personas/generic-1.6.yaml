# A plain OCPP 1.6J AC charge point with spec-default behaviour.
# Other personas can `extends: generic-1.6` and override only what differs.
persona: generic-1.6
description: Generic OCPP 1.6J AC charge point
boot:
  chargePointVendor: ocpp-mimic
  chargePointModel: Generic-AC
  firmwareVersion: 0.0.0
connectors: 1
power:
  offeredW: 7360
features: [Core, RemoteTrigger, LocalAuthListManagement, Reservation]
config:
  HeartbeatInterval: 300
  MeterValueSampleInterval: 60
  ConnectionTimeOut: 60
timing:
  startTransactionDelay: 500ms
  actionDelay: 100ms
  resetDowntime:
    soft: 30s
    hard: 3m
  bootRetry: 60s
# Made-up EV profiles for plugging in with an EV (power and SoC follow the
# charging curve). test-5kwh fills up within minutes for quick tests.
evs:
  compact-40kwh: { capacityKWh: 40, initialSoc: 20, maxPowerW: 7400, phases: 1 }
  sedan-75kwh: { capacityKWh: 75, initialSoc: 30, maxPowerW: 11000, phases: 3 }
  test-5kwh: { capacityKWh: 5, initialSoc: 70, maxPowerW: 7400, phases: 1 }
faults:
  - { name: Ground fault, errorCode: GroundFailure }
  - { name: Over temperature, errorCode: HighTemperature }
  - { name: Connector lock failure, errorCode: ConnectorLockFailure }
  - { name: Power meter failure, errorCode: PowerMeterFailure }
