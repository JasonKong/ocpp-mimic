name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets maintainers rerun everything on main, e.g. to check that the
  # regression scenarios pass reliably.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scenarios:
    name: regression scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run scenarios/regression against the built-in CSMS
        run: |
          set -o pipefail
          node packages/cli/dist/main.js run scenarios/regression \
            --personas scenarios/personas --junit reports/scenarios.xml | tee reports-console.txt
      - name: Check the /metrics output with promtool
        run: |
          node packages/cli/dist/main.js csms --port 9100 --status 0 &
          node packages/cli/dist/main.js serve --port 7300 &
          for i in $(seq 1 50); do curl -sf localhost:7300/api/health > /dev/null && break; sleep 0.2; done
          curl -sf -X POST localhost:7300/api/stations/bulk -H 'content-type: application/json' \
            -d '{"count":3,"id":"PROM-{1}","persona":"generic-1.6","csmsUrl":"ws://127.0.0.1:9100/ocpp","group":"ci"}'
          sleep 5
          curl -sf localhost:7300/metrics | tee metrics.txt | head -20
          docker run --rm -i --entrypoint promtool prom/prometheus:v3.5.0 check metrics < metrics.txt
      - name: Check the OTLP export with an OpenTelemetry Collector
        run: |
          cat > otel.yaml <<'YAML'
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            debug:
              verbosity: detailed
          service:
            pipelines:
              metrics:
                receivers: [otlp]
                exporters: [debug]
          YAML
          docker run -d --name otel -p 4318:4318 -v "$PWD/otel.yaml:/etc/otelcol/config.yaml" otel/opentelemetry-collector:0.120.0
          node packages/cli/dist/main.js csms --port 9101 --status 0 &
          OTEL_METRIC_EXPORT_INTERVAL=1000 node packages/cli/dist/main.js serve --port 7301 \
            --otlp-endpoint http://127.0.0.1:4318 > serve-otlp.log 2>&1 &
          for i in $(seq 1 50); do curl -sf localhost:7301/api/health > /dev/null && break; sleep 0.2; done
          curl -sf -X POST localhost:7301/api/stations/bulk -H 'content-type: application/json' \
            -d '{"count":2,"id":"OTEL-{1}","persona":"generic-1.6","csmsUrl":"ws://127.0.0.1:9101/ocpp"}'
          sleep 8
          if ! docker logs otel 2>&1 | grep -q 'ocpp_mimic_stations'; then
            docker logs otel; cat serve-otlp.log; exit 1
          fi
          if grep -q 'OTLP export' serve-otlp.log; then cat serve-otlp.log; exit 1; fi
          docker logs otel 2>&1 | grep -m 5 'Name: ocpp_mimic'
      - name: Add the results to the job summary
        if: always()
        run: |
          {
            echo '### Regression scenarios'
            echo '```'
            cat reports-console.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-junit
          path: reports/scenarios.xml
          if-no-files-found: warn
